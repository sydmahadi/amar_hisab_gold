
name: Build Amar Hisab APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.5"
          cache: true

      - name: Show versions
        run: |
          flutter --version
          java -version

      - name: Validate project
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart

      - name: Regenerate Android project
        run: |
          rm -rf android
          flutter create \
            --platforms=android \
            --org com.sydmahadi \
            --project-name amar_hisab \
            .

      - name: Pin Android Gradle and Kotlin versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          settings_files = [
              Path("android/settings.gradle.kts"),
              Path("android/settings.gradle"),
          ]

          settings = next(
              (p for p in settings_files if p.exists()),
              None
          )

          if settings is None:
              raise SystemExit("ERROR: Android settings.gradle not found")

          content = settings.read_text()

          # Use AGP 8.x to avoid the AGP 9 built-in Kotlin issue.
          if settings.name.endswith(".kts"):
              content, agp_count = re.subn(
                  r'(id\(["\']com\.android\.application["\']\)'
                  r'\s+version\s+)["\'][^"\']+["\']',
                  r'\g<1>"8.13.0"',
                  content,
                  count=1
              )

              content, kotlin_count = re.subn(
                  r'(id\(["\']org\.jetbrains\.kotlin\.android["\']\)'
                  r'\s+version\s+)["\'][^"\']+["\']',
                  r'\g<1>"2.2.20"',
                  content,
                  count=1
              )

          else:
              content, agp_count = re.subn(
                  r'(id\s+["\']com\.android\.application["\']'
                  r'\s+version\s+)["\'][^"\']+["\']',
                  r'\g<1>"8.13.0"',
                  content,
                  count=1
              )

              content, kotlin_count = re.subn(
                  r'(id\s+["\']org\.jetbrains\.kotlin\.android["\']'
                  r'\s+version\s+)["\'][^"\']+["\']',
                  r'\g<1>"2.2.20"',
                  content,
                  count=1
              )

          if agp_count != 1:
              raise SystemExit(
                  "ERROR: Could not pin Android application plugin version"
              )

          if kotlin_count != 1:
              raise SystemExit(
                  "ERROR: Could not pin Kotlin Android plugin version"
              )

          settings.write_text(content)

          wrapper = Path(
              "android/gradle/wrapper/gradle-wrapper.properties"
          )

          if not wrapper.exists():
              raise SystemExit("ERROR: Gradle wrapper properties not found")

          wrapper_content = wrapper.read_text()

          wrapper_content, count = re.subn(
              r"distributionUrl=.*",
              "distributionUrl=https\\://services.gradle.org/"
              "distributions/gradle-8.13-bin.zip",
              wrapper_content,
              count=1
          )

          if count != 1:
              raise SystemExit("ERROR: Could not configure Gradle wrapper")

          wrapper.write_text(wrapper_content)

          print(settings.read_text())
          print("Gradle wrapper configured.")
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Configure Android app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle_files = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]

          gradle = next(
              (p for p in gradle_files if p.exists()),
              None
          )

          if gradle is None:
              raise SystemExit("ERROR: App Gradle file not found")

          content = gradle.read_text()
          is_kts = gradle.name.endswith(".kts")

          # Set compile SDK 36.
          if is_kts:
              content, count = re.subn(
                  r'compileSdk\s*=\s*\d+',
                  'compileSdk = 36',
                  content,
                  count=1
              )
          else:
              content, count = re.subn(
                  r'compileSdk\s+\d+',
                  'compileSdk 36',
                  content,
                  count=1
              )

          if count != 1:
              raise SystemExit("ERROR: Could not set compileSdk")

          # Enable Java core library desugaring.
          if "coreLibraryDesugaringEnabled" not in content:
              if is_kts:
                  content, count = re.subn(
                      r'(compileOptions\s*\{)',
                      r'\1\n        isCoreLibraryDesugaringEnabled = true',
                      content,
                      count=1
                  )
              else:
                  content, count = re.subn(
                      r'(compileOptions\s*\{)',
                      r'\1\n        coreLibraryDesugaringEnabled true',
                      content,
                      count=1
                  )

              if count != 1:
                  raise SystemExit("ERROR: compileOptions block not found")

          # Add desugaring dependency.
          if "desugar_jdk_libs" not in content:
              dependency = (
                  '\n    coreLibraryDesugaring('
                  '"com.android.tools:desugar_jdk_libs:2.1.4")\n'
                  if is_kts
                  else '\n    coreLibraryDesugaring '
                  '"com.android.tools:desugar_jdk_libs:2.1.4"\n'
              )

              match = re.search(r'dependencies\s*\{', content)

              if match:
                  pos = match.end()
                  content = content[:pos] + dependency + content[pos:]
              else:
                  content += '\n\ndependencies {' + dependency + '}\n'

          gradle.write_text(content)
          print(gradle.read_text())
          PY

      - name: Configure AndroidX
        run: |
          if ! grep -q '^android.useAndroidX=true' android/gradle.properties; then
            echo 'android.useAndroidX=true' >> android/gradle.properties
          fi

          if ! grep -q '^android.enableJetifier=true' android/gradle.properties; then
            echo 'android.enableJetifier=true' >> android/gradle.properties
          fi

      - name: Set app label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/src/main/AndroidManifest.xml")
          content = path.read_text()

          content, count = re.subn(
              r'android:label="[^"]*"',
              'android:label="আমার হিসাব"',
              content,
              count=1
          )

          if count:
              path.write_text(content)

          print("App label configured.")
          PY

      - name: Configure launcher icon
        run: |
          if [ -f icon.png ]; then
            cat > flutter_launcher_icons.yaml <<'EOF'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "icon.png"
            min_sdk_android: 21
            adaptive_icon_background: "#0F5132"
            adaptive_icon_foreground: "icon.png"
          EOF

            dart run flutter_launcher_icons \
              -f flutter_launcher_icons.yaml
          else
            echo "WARNING: icon.png not found; default icon will be used."
          fi

      - name: Clean and resolve dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Verify File Picker Android source
        run: |
          find "$HOME/.pub-cache" \
            -path "*/file_picker-11.0.3/android/src/main/*" \
            -type f \
            \( -name "FilePickerPlugin.kt" -o -name "FilePickerPlugin.java" \) \
            -print

      - name: Verify Android Gradle versions
        run: |
          grep -nE 'com.android.application|kotlin.android' \
            android/settings.gradle.kts \
            android/settings.gradle 2>/dev/null || true

          grep '^distributionUrl=' \
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Analyze Flutter code
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: amar-hisab-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
