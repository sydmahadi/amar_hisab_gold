name: Build Amar Hisab APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Recreate Android project
        run: |
          rm -rf android
          flutter create --platforms=android --org com.sydmahadi .

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Verify File Picker installation
        run: |
          flutter pub deps | grep -A 4 -B 2 file_picker
          find "$HOME/.pub-cache/hosted/pub.dev" \
            -path '*/file_picker-*/android/src/main/*' \
            -type f -name '*Plugin*' -print

      - name: Create launcher icon configuration
        run: |
          cat > flutter_launcher_icons.yaml <<'EOF'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "icon.png"
            adaptive_icon_background: "#0F5132"
            adaptive_icon_foreground: "icon.png"
          EOF

      - name: Set Android app name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")

          if not manifest.exists():
              raise SystemExit("ERROR: AndroidManifest.xml not found.")

          content = manifest.read_text(encoding="utf-8")
          updated, count = re.subn(
              r'android:label="[^"]*"',
              'android:label="আমার হিসাব"',
              content,
              count=1
          )

          if count == 0:
              raise SystemExit("ERROR: android:label not found.")

          manifest.write_text(updated, encoding="utf-8")
          print("App name set to আমার হিসাব")
          PY

      - name: Verify launcher icon
        run: |
          test -f icon.png || {
            echo "ERROR: icon.png missing from project root."
            exit 1
          }

      - name: Generate launcher icon
        run: |
          dart run flutter_launcher_icons -f flutter_launcher_icons.yaml

      - name: Configure compileSdk 36 and desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]
          gradle = next((p for p in candidates if p.exists()), None)

          if gradle is None:
              raise SystemExit("ERROR: App Gradle file not found.")

          content = gradle.read_text(encoding="utf-8")
          is_kts = gradle.name.endswith(".kts")

          # Set compileSdk.
          patterns = (
              [
                  (r"\bcompileSdk\s*=\s*[^\n]+", "compileSdk = 36"),
                  (r"\bcompileSdk\s+[^\n]+", "compileSdk = 36"),
              ]
              if is_kts
              else [
                  (r"\bcompileSdkVersion\s+[^\n]+", "compileSdkVersion 36"),
                  (r"\bcompileSdk\s*=\s*[^\n]+", "compileSdk = 36"),
                  (r"\bcompileSdk\s+[^\n]+", "compileSdk 36"),
              ]
          )

          for pattern, replacement in patterns:
              updated, count = re.subn(
                  pattern, replacement, content, count=1
              )
              if count:
                  content = updated
                  break
          else:
              raise SystemExit("ERROR: compileSdk setting not found.")

          # Enable core library desugaring.
          match = re.search(r"\bcompileOptions\s*\{", content)
          if not match:
              raise SystemExit("ERROR: compileOptions block not found.")

          if not re.search(
              r"\bisCoreLibraryDesugaringEnabled\b|"
              r"\bcoreLibraryDesugaringEnabled\b",
              content
          ):
              setting = (
                  "isCoreLibraryDesugaringEnabled = true"
                  if is_kts
                  else "coreLibraryDesugaringEnabled true"
              )
              pos = match.end()
              content = (
                  content[:pos] + "\n        " + setting + content[pos:]
              )

          # Add the dependency to an existing top-level block,
          # or create the block if the template has none.
          if "desugar_jdk_libs" not in content:
              dep_match = re.search(
                  r"(?m)^dependencies\s*\{", content
              )

              dependency = (
                  '    coreLibraryDesugaring('
                  '"com.android.tools:desugar_jdk_libs:2.1.4")'
                  if is_kts
                  else
                  "    coreLibraryDesugaring "
                  "'com.android.tools:desugar_jdk_libs:2.1.4'"
              )

              if dep_match:
                  opening = content.find("{", dep_match.start())
                  depth = 0
                  closing = None

                  for i in range(opening, len(content)):
                      if content[i] == "{":
                          depth += 1
                      elif content[i] == "}":
                          depth -= 1
                          if depth == 0:
                              closing = i
                              break

                  if closing is None:
                      raise SystemExit(
                          "ERROR: dependencies block not closed."
                      )

                  content = (
                      content[:closing]
                      + "\n" + dependency + "\n"
                      + content[closing:]
                  )
              else:
                  content = (
                      content.rstrip()
                      + "\n\ndependencies {\n"
                      + dependency
                      + "\n}\n"
                  )

          gradle.write_text(content, encoding="utf-8")
          print("compileSdk 36 and desugaring configured.")
          PY

      - name: Patch gallery_saver_plus compileSdk
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          cache = Path.home() / ".pub-cache/hosted/pub.dev"
          files = list(cache.glob(
              "gallery_saver_plus-*/android/build.gradle"
          ))
          files += list(cache.glob(
              "gallery_saver_plus-*/android/build.gradle.kts"
          ))

          for gradle in files:
              content = gradle.read_text(encoding="utf-8")
              content = re.sub(
                  r"\bcompileSdkVersion\s+\d+",
                  "compileSdkVersion 36", content
              )
              content = re.sub(
                  r"\bcompileSdk\s*=\s*\d+",
                  "compileSdk = 36", content
              )
              content = re.sub(
                  r"\bcompileSdk\s+\d+",
                  "compileSdk 36", content
              )
              gradle.write_text(content, encoding="utf-8")
              print("Patched:", gradle)

          if not files:
              print("No gallery_saver_plus Gradle file found.")
          PY

      - name: Enable AndroidX
        run: |
          touch android/gradle.properties

          grep -q '^android.useAndroidX=' android/gradle.properties \
            || echo 'android.useAndroidX=true' >> android/gradle.properties

          grep -q '^android.enableJetifier=' android/gradle.properties \
            || echo 'android.enableJetifier=true' >> android/gradle.properties

      - name: Regenerate Flutter plugin registration
        run: |
          flutter clean
          flutter pub get

          echo "Checking generated plugin registration..."
          grep -n "FilePickerPlugin" \
            android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java \
            || true

      - name: Verify Android configuration
        run: |
          echo "APP NAME"
          grep -n 'android:label' \
            android/app/src/main/AndroidManifest.xml || true

          echo "COMPILE SDK AND DESUGARING"
          grep -n -E 'compileSdk|coreLibraryDesugaring|desugar_jdk_libs' \
            android/app/build.gradle* || true

          echo "ANDROIDX"
          cat android/gradle.properties

      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: amar-hisab-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
