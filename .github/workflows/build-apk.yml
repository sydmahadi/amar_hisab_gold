
name: Build Amar Hisab APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.5"
          cache: true

      - name: Show Flutter version
        run: |
          flutter --version
          dart --version

      - name: Check project files
        run: |
          test -f pubspec.yaml || {
            echo "ERROR: pubspec.yaml not found"
            exit 1
          }

          test -f lib/main.dart || {
            echo "ERROR: lib/main.dart not found"
            exit 1
          }

      - name: Regenerate Android platform files
        run: |
          rm -rf android
          flutter create \
            --platforms=android \
            --org com.sydmahadi \
            --project-name amar_hisab \
            .

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Verify dependency versions
        run: |
          flutter pub deps
          grep -n "file_picker:" pubspec.yaml
          grep -n "share_plus:" pubspec.yaml

      - name: Configure Android build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("android/app/build.gradle.kts")

          if not gradle.exists():
              gradle = Path("android/app/build.gradle")

          if not gradle.exists():
              raise SystemExit("ERROR: Android app Gradle file not found")

          content = gradle.read_text()

          if gradle.name.endswith(".kts"):
              content = re.sub(
                  r'compileSdk\s*=\s*\d+',
                  'compileSdk = 36',
                  content,
                  count=1
              )

              if "isCoreLibraryDesugaringEnabled" not in content:
                  content = re.sub(
                      r'(compileOptions\s*\{)',
                      r'\1\n        isCoreLibraryDesugaringEnabled = true',
                      content,
                      count=1
                  )

              if "coreLibraryDesugaring(" not in content:
                  dependency = (
                      '\n    coreLibraryDesugaring('
                      '"com.android.tools:desugar_jdk_libs:2.1.4")\n'
                  )

                  match = re.search(r'dependencies\s*\{', content)

                  if match:
                      pos = match.end()
                      content = (
                          content[:pos]
                          + dependency
                          + content[pos:]
                      )
                  else:
                      content += (
                          '\n\ndependencies {' + dependency + '}\n'
                      )

          else:
              content = re.sub(
                  r'compileSdk\s+\d+',
                  'compileSdk 36',
                  content,
                  count=1
              )

              if "coreLibraryDesugaringEnabled" not in content:
                  content = re.sub(
                      r'(compileOptions\s*\{)',
                      r'\1\n        coreLibraryDesugaringEnabled true',
                      content,
                      count=1
                  )

              if "coreLibraryDesugaring " not in content:
                  dependency = (
                      '\n    coreLibraryDesugaring '
                      '"com.android.tools:desugar_jdk_libs:2.1.4"\n'
                  )

                  match = re.search(r'dependencies\s*\{', content)

                  if match:
                      pos = match.end()
                      content = (
                          content[:pos]
                          + dependency
                          + content[pos:]
                      )
                  else:
                      content += (
                          '\n\ndependencies {' + dependency + '}\n'
                      )

          gradle.write_text(content)
          print("Android Gradle configuration updated.")
          PY

      - name: Enable AndroidX
        run: |
          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      - name: Configure app label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/src/main/AndroidManifest.xml")
          content = path.read_text()

          content = re.sub(
              r'android:label="[^"]*"',
              'android:label="আমার হিসাব"',
              content,
              count=1
          )

          path.write_text(content)
          print("App label set.")
          PY

      - name: Configure launcher icon
        run: |
          if [ -f icon.png ]; then
            cat > flutter_launcher_icons.yaml <<'EOF'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "icon.png"
            min_sdk_android: 21
            adaptive_icon_background: "#0F5132"
            adaptive_icon_foreground: "icon.png"
          EOF

            dart run flutter_launcher_icons \
              -f flutter_launcher_icons.yaml
          else
            echo "WARNING: icon.png not found; default icon will be used."
          fi

      - name: Clean project
        run: flutter clean

      - name: Get dependencies again
        run: flutter pub get

      - name: Verify generated plugin registration
        run: |
          if [ -f android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java ]; then
            cat android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java
          else
            echo "GeneratedPluginRegistrant.java not found at the expected path."
            echo "Flutter may register plugins through another generated file."
          fi

      - name: Analyze Flutter code
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: amar-hisab-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
