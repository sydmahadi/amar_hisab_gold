name: Build Amar Hisab APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          rm -rf android
          flutter create --platforms=android --org com.sydmahadi .

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Create launcher icon configuration
        run: |
          cat > flutter_launcher_icons.yaml <<'EOF'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "icon.png"
            adaptive_icon_background: "#0F5132"
            adaptive_icon_foreground: "icon.png"
          EOF

      - name: Set Android app name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")

          if not manifest.exists():
              raise SystemExit("ERROR: AndroidManifest.xml not found.")

          content = manifest.read_text(encoding="utf-8")

          updated, count = re.subn(
              r'android:label="[^"]*"',
              'android:label="আমার হিসাব"',
              content,
              count=1
          )

          if count == 0:
              raise SystemExit("ERROR: android:label not found.")

          manifest.write_text(updated, encoding="utf-8")
          print("App name set to: আমার হিসাব")
          PY

      - name: Verify launcher icon
        run: |
          if [ ! -f "icon.png" ]; then
            echo "ERROR: icon.png was not found in project root."
            exit 1
          fi
          ls -lh icon.png

      - name: Generate launcher icon
        run: |
          dart run flutter_launcher_icons -f flutter_launcher_icons.yaml

      - name: Configure Android compileSdk 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]

          gradle = next((p for p in candidates if p.exists()), None)

          if gradle is None:
              raise SystemExit("ERROR: Android app Gradle file not found.")

          content = gradle.read_text(encoding="utf-8")
          is_kts = gradle.name.endswith(".kts")

          if is_kts:
              patterns = [
                  (r"compileSdk\s*=\s*[^\n]+", "compileSdk = 36"),
                  (r"compileSdk\s+[^\n]+", "compileSdk = 36"),
              ]
          else:
              patterns = [
                  (r"compileSdkVersion\s+[^\n]+", "compileSdkVersion 36"),
                  (r"compileSdk\s*=\s*[^\n]+", "compileSdk = 36"),
                  (r"compileSdk\s+[^\n]+", "compileSdk 36"),
              ]

          for pattern, replacement in patterns:
              updated, count = re.subn(
                  pattern, replacement, content, count=1
              )
              if count:
                  content = updated
                  break
          else:
              raise SystemExit("ERROR: compileSdk setting not found.")

          gradle.write_text(content, encoding="utf-8")
          print("Updated compileSdk in:", gradle)
          PY

      - name: Enable core library desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]

          gradle = next((p for p in candidates if p.exists()), None)

          if gradle is None:
              raise SystemExit("ERROR: App Gradle file not found.")

          content = gradle.read_text(encoding="utf-8")
          is_kts = gradle.name.endswith(".kts")

          compile_match = re.search(r"\bcompileOptions\s*\{", content)

          if not compile_match:
              raise SystemExit("ERROR: compileOptions block not found.")

          if is_kts:
              setting = "isCoreLibraryDesugaringEnabled = true"
          else:
              setting = "coreLibraryDesugaringEnabled true"

          if not re.search(
              r"\bisCoreLibraryDesugaringEnabled\b|"
              r"\bcoreLibraryDesugaringEnabled\b",
              content
          ):
              insert_at = compile_match.end()
              content = (
                  content[:insert_at]
                  + "\n        " + setting
                  + content[insert_at:]
              )

          dependencies_match = re.search(r"\bdependencies\s*\{", content)

          if not dependencies_match:
              raise SystemExit("ERROR: dependencies block not found.")

          if "desugar_jdk_libs" not in content:
              insert_at = dependencies_match.end()

              if is_kts:
                  dependency = (
                      '\n    coreLibraryDesugaring('
                      '"com.android.tools:desugar_jdk_libs:2.1.4")'
                  )
              else:
                  dependency = (
                      "\n    coreLibraryDesugaring "
                      "'com.android.tools:desugar_jdk_libs:2.1.4'"
                  )

              content = (
                  content[:insert_at]
                  + dependency
                  + content[insert_at:]
              )

          gradle.write_text(content, encoding="utf-8")
          print("Core library desugaring configured in:", gradle)
          PY

      - name: Patch gallery_saver_plus Android compileSdk
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          pub_cache = Path.home() / ".pub-cache" / "hosted" / "pub.dev"

          files = list(
              pub_cache.glob("gallery_saver_plus-*/android/build.gradle")
          )
          files += list(
              pub_cache.glob("gallery_saver_plus-*/android/build.gradle.kts")
          )

          if not files:
              print("WARNING: gallery_saver_plus Gradle file not found.")
          else:
              for gradle in files:
                  content = gradle.read_text(encoding="utf-8")

                  content = re.sub(
                      r"compileSdkVersion\s+\d+",
                      "compileSdkVersion 36",
                      content
                  )

                  content = re.sub(
                      r"compileSdk\s*=\s*\d+",
                      "compileSdk = 36",
                      content
                  )

                  content = re.sub(
                      r"compileSdk\s+\d+",
                      "compileSdk 36",
                      content
                  )

                  gradle.write_text(content, encoding="utf-8")
                  print("Patched:", gradle)
          PY

      - name: Enable AndroidX
        run: |
          touch android/gradle.properties

          if ! grep -q '^android.useAndroidX=' android/gradle.properties; then
            echo 'android.useAndroidX=true' >> android/gradle.properties
          fi

          if ! grep -q '^android.enableJetifier=' android/gradle.properties; then
            echo 'android.enableJetifier=true' >> android/gradle.properties
          fi

      - name: Verify Android configuration
        run: |
          echo "APP NAME"
          grep -n "android:label" android/app/src/main/AndroidManifest.xml || true

          echo "APP COMPILE SDK"
          grep -n "compileSdk" android/app/build.gradle* || true

          echo "CORE LIBRARY DESUGARING"
          grep -n -E "coreLibraryDesugaring|desugar_jdk_libs" \
            android/app/build.gradle* || true

          echo "GALLERY SAVER PLUS COMPILE SDK"
          grep -n "compileSdk" \
            "$HOME"/.pub-cache/hosted/pub.dev/gallery_saver_plus-*/android/build.gradle* \
            || true

          echo "ANDROID PROPERTIES"
          cat android/gradle.properties

      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: amar-hisab-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
